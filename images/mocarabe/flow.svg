<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 392" font-family="Times New Roman, Times, serif" font-size="16">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#121212"/>
    </marker>
  </defs>
  <rect width="540" height="392" fill="#fff"/>
  <g fill="#f3f3f3" stroke="#121212">
    <rect x="10" y="8" width="200" height="40" rx="6"/>
    <rect x="10" y="76" width="200" height="40" rx="6"/>
    <rect x="10" y="144" width="200" height="40" rx="6"/>
    <rect x="10" y="212" width="200" height="40" rx="6"/>
    <!-- route & schedule: one strategy or the other -->
    <rect x="10" y="280" width="88" height="40" rx="6"/>
    <rect x="122" y="280" width="88" height="40" rx="6"/>
    <rect x="10" y="348" width="200" height="40" rx="6"/>
  </g>
  <g stroke="#121212" fill="none">
    <line x1="110" y1="48" x2="110" y2="75" marker-end="url(#arrow)"/>
    <line x1="110" y1="116" x2="110" y2="143" marker-end="url(#arrow)"/>
    <line x1="110" y1="184" x2="110" y2="211" marker-end="url(#arrow)"/>
    <!-- fork into the two strategies, then join again -->
    <polyline points="110,252 110,264"/>
    <polyline points="54,264 166,264"/>
    <line x1="54" y1="264" x2="54" y2="279" marker-end="url(#arrow)"/>
    <line x1="166" y1="264" x2="166" y2="279" marker-end="url(#arrow)"/>
    <polyline points="54,320 54,334 166,334 166,320"/>
    <line x1="110" y1="334" x2="110" y2="347" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" fill="#121212" font-weight="600">
    <text x="110" y="33">C kernel</text>
    <text x="110" y="101">Dataflow graph</text>
    <text x="110" y="169">Pack</text>
    <text x="110" y="237">Place</text>
    <text x="54" y="305" font-size="15">ILP (SCIP)</text>
    <text x="166" y="305" font-size="15">PathFinder</text>
    <text x="110" y="373">Outputs</text>
  </g>
  <text x="110" y="305" text-anchor="middle" font-style="italic" fill="#121212">or</text>
  <g fill="#555">
    <text x="228" y="67">LLVM pass</text>
    <text x="228" y="169">hMETIS: group ops into PE-sized clusters</text>
    <text x="228" y="237">simulated annealing on torus distance</text>
    <text x="228" y="296">route &amp; schedule over space and time,</text>
    <text x="228" y="315">with either strategy</text>
    <text x="228" y="365">RTL package, bitstream,</text>
    <text x="228" y="384">self-checking testbench</text>
  </g>
</svg>
